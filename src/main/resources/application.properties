spring.application.name=cache-lab
spring.datasource.url=jdbc:h2:mem:cachelab;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.cache.type=caffeine
spring.cache.cache-names=products
spring.cache.caffeine.spec=maximumSize=8,expireAfterWrite=10m,recordStats
app.cors.origins=http://localhost:5173,http://127.0.0.1:5173
server.error.include-message=always
